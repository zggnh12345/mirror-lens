<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>登录 · Mirror Lens</title>
<style>
  :root{
    --bg:#0b1020; --panel:#141b31; --line:#26304d; --text:#e8edf7; --dim:#8b97b3;
    --accent:#4f7cff; --ok:#2fbf71; --warn:#f0a63a; --bad:#f2545b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;
    background:radial-gradient(1000px 600px at 50% -10%,#1a2a52 0%,var(--bg) 55%);
    color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);
    border-radius:18px;padding:28px 22px 22px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}
  h1{font-size:19px;margin:0;letter-spacing:.3px}
  p.sub{color:var(--dim);font-size:13px;margin:6px 0 22px}
  label{display:block;font-size:12px;color:var(--dim);margin:14px 0 6px}
  input{width:100%;padding:12px 13px;border-radius:11px;border:1px solid var(--line);
    background:#0f1628;color:var(--text);font-size:16px;outline:none;transition:border-color .15s}
  input:focus{border-color:var(--accent)}
  button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:11px;background:var(--accent);
    color:#fff;font-size:15px;font-weight:600;letter-spacing:.5px;cursor:pointer}
  button:disabled{opacity:.6}
  .err{color:var(--bad);font-size:13px;margin-top:12px;min-height:18px}
  .hint{color:var(--dim);font-size:12px;margin-top:16px;text-align:center}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <div class="brand"><span class="dot"></span><h1>Mirror Lens</h1></div>
  <p class="sub">镜像加速源监测 · 请登录</p>
  <label for="u">用户名</label>
  <input id="u" name="username" autocomplete="username" value="admin" autocapitalize="off" spellcheck="false">
  <label for="p">密码</label>
  <input id="p" name="password" type="password" autocomplete="current-password" placeholder="默认 admin">
  <button id="btn" type="submit">登录</button>
  <div class="err" id="err"></div>
  <div class="hint">首次登录使用 admin / admin，登录后请到设置里改密码</div>
</form>
<script>
const f=document.getElementById('f'),err=document.getElementById('err'),btn=document.getElementById('btn');
f.addEventListener('submit',async e=>{
  e.preventDefault();
  err.textContent='';btn.disabled=true;btn.textContent='登录中…';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({user:document.getElementById('u').value.trim(),pass:document.getElementById('p').value})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'登录失败');
    location.href='/';
  }catch(ex){
    err.textContent=ex.message;btn.disabled=false;btn.textContent='登录';
    document.getElementById('p').select();
  }
});
</script>
</body>
</html>
