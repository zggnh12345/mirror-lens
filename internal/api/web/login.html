<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>登录 · Mirror Lens</title>
<meta name="theme-color" content="#f6f7f9">
<script>(function(){try{var t=localStorage.getItem('ml_theme')||'system';var d=t==='dark'||(t==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';}catch(e){}})();</script>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="loginwrap" style="position:relative">
  <button class="iconbtn" id="btnTheme" style="position:absolute;top:18px;right:18px" title="切换主题" aria-label="切换主题">
    <svg viewBox="0 0 24 24" id="themeIcon"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>

  <form class="card" id="f" autocomplete="on">
    <div class="logo">M</div>
    <h1>Mirror Lens</h1>
    <div class="sub">镜像加速源监测 · 请登录</div>

    <label for="u">用户名</label>
    <input type="text" id="u" name="username" autocomplete="username" value="admin" autocapitalize="off" spellcheck="false">
    <label for="p">密码</label>
    <input type="password" id="p" name="password" autocomplete="current-password" placeholder="默认 admin">
    <button class="btn primary full" id="btn" type="submit">登录</button>
    <div class="err" id="err"></div>
    <div class="hint" style="text-align:center">首次登录用 admin / admin，进去后到设置里改掉</div>
  </form>
</div>
<script>
'use strict';
var $ = function(s){ return document.querySelector(s); };
var THEMES = ['light','dark','system'];
var TNAME = {light:'白天', dark:'黑暗', system:'跟随系统'};
function curTheme(){ try{ return localStorage.getItem('ml_theme') || 'system'; }catch(e){ return 'system'; } }
function applyTheme(t){
  var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme:dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  var m = document.querySelector('meta[name=theme-color]');
  if (m) m.setAttribute('content', dark ? '#0d1117' : '#f6f7f9');
  $('#themeIcon').innerHTML = t === 'system'
    ? '<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>'
    : (dark ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
            : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>');
  $('#btnTheme').title = '主题：' + TNAME[t];
}
$('#btnTheme').addEventListener('click', function(){
  var t = THEMES[(THEMES.indexOf(curTheme()) + 1) % 3];
  try{ localStorage.setItem('ml_theme', t); }catch(e){}
  applyTheme(t);
});
applyTheme(curTheme());

$('#f').addEventListener('submit', async function(e){
  e.preventDefault();
  var err = $('#err'), btn = $('#btn');
  err.textContent = ''; btn.disabled = true; btn.textContent = '登录中…';
  try{
    var r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({user: $('#u').value.trim(), pass: $('#p').value})});
    var d = {};
    try { d = await r.json(); } catch(e2){}
    if (!r.ok) throw new Error(d.error || '登录失败');
    location.href = '/';
  }catch(ex){
    err.textContent = ex.message; btn.disabled = false; btn.textContent = '登录';
    $('#p').select();
  }
});
</script>
</body>
</html>
