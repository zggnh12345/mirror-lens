<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>设置 · Mirror Lens</title>
<meta name="theme-color" content="#f6f7f9">
<script>(function(){try{var t=localStorage.getItem('ml_theme')||'system';var d=t==='dark'||(t==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';}catch(e){}})();</script>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header>
  <div class="hbar">
    <a class="iconbtn" href="/" title="返回面板" aria-label="返回面板">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="titles">
      <h1>设置</h1>
      <div class="sub" id="sub">账号、外观与探测节奏</div>
    </div>
    <div class="spacer"></div>
  </div>
</header>

<div class="wrap" style="max-width:640px">

  <!-- 账号 -->
  <div class="sec" style="margin-top:14px">
    <h2>账号</h2>
    <p class="desc">改用户名和密码都要先验证当前密码。改完密码，其他设备上的登录会立即失效。</p>

    <label for="acUser">用户名</label>
    <input type="text" id="acUser" autocomplete="username" spellcheck="false">
    <div class="hint" id="acUserHint">3-32 位，只能用字母、数字、下划线、短横线、点。</div>

    <div class="grid2" style="margin-top:2px">
      <div>
        <label for="acOld">当前密码</label>
        <input type="password" id="acOld" autocomplete="current-password" placeholder="必填">
      </div>
      <div>
        <label for="acNew">新密码</label>
        <input type="password" id="acNew" autocomplete="new-password" placeholder="不改就留空">
      </div>
    </div>
    <label for="acNew2">再输一次新密码</label>
    <input type="password" id="acNew2" autocomplete="new-password" placeholder="不改就留空">

    <div class="saverow">
      <button class="btn primary" id="btnAccount">保存账号</button>
      <span class="hint" id="acMsg"></span>
    </div>
  </div>

  <!-- 外观 -->
  <div class="sec">
    <h2>外观</h2>
    <p class="desc">跟随系统时，手机或电脑切到深色，面板会跟着变。</p>
    <div class="seg" id="themeSeg">
      <button data-t="light"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>白天</button>
      <button data-t="dark"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>黑暗</button>
      <button data-t="system"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>跟随系统</button>
    </div>
    <div class="hint" id="thMsg" style="margin-top:10px">当前：跟随系统</div>
  </div>

  <!-- 探测 -->
  <div class="sec">
    <h2>探测节奏</h2>
    <p class="desc">分三层跑：先探活，再验可用，最后测速和内容校验。数字越小越勤，也越费流量。</p>
    <div class="grid2">
      <div>
        <label for="setL1">探活间隔（分钟）</label>
        <input type="number" id="setL1" min="1" max="1440">
      </div>
      <div>
        <label for="setL2">可用性间隔（分钟）</label>
        <input type="number" id="setL2" min="2" max="1440">
      </div>
      <div>
        <label for="setL3">测速与校验（分钟）</label>
        <input type="number" id="setL3" min="10" max="10080">
      </div>
      <div>
        <label for="setExp">导出条数上限</label>
        <input type="number" id="setExp" min="1" max="20">
      </div>
    </div>
    <label for="setTTL">登录有效期（小时）</label>
    <input type="number" id="setTTL" min="1" max="8760">
    <div class="saverow">
      <button class="btn primary" id="btnSettings">保存设置</button>
      <span class="hint" id="setMsg"></span>
    </div>
  </div>

  <!-- 关于 -->
  <div class="sec">
    <h2>关于</h2>
    <div class="kv"><span>版本</span><span id="aboutVer">—</span></div>
    <div class="kv"><span>当前账号</span><span id="aboutUser">—</span></div>
    <div class="kv"><span>数据</span><span>SQLite，单文件，随容器卷保存</span></div>
    <div class="saverow" style="margin-top:14px">
      <button class="btn danger" id="btnLogout">退出登录</button>
      <span class="hint">退出后需要重新输入账号密码</span>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
var $ = function(s){ return document.querySelector(s); };
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on');},2200);}
function say(el, msg, kind){ el.className = 'hint' + (kind ? ' ' + kind : ''); el.textContent = msg; }

async function api(path, opt){
  opt = opt || {};
  opt.headers = Object.assign({'Content-Type':'application/json'}, opt.headers||{});
  var r = await fetch(path, opt);
  if (r.status === 401){ location.href = '/login'; throw new Error('未登录'); }
  var d = {};
  try { d = await r.json(); } catch(e){}
  if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
  return d;
}

/* ---- 主题 ---- */
var TNAME = {light:'白天', dark:'黑暗', system:'跟随系统'};
function curTheme(){ try{ return localStorage.getItem('ml_theme') || 'system'; }catch(e){ return 'system'; } }
function applyTheme(t){
  var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme:dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  var m = document.querySelector('meta[name=theme-color]');
  if (m) m.setAttribute('content', dark ? '#0d1117' : '#f6f7f9');
  document.querySelectorAll('#themeSeg button').forEach(function(b){ b.classList.toggle('on', b.dataset.t === t); });
  $('#thMsg').textContent = '当前：' + TNAME[t] + (t === 'system' ? '（现在是' + (dark ? '黑暗' : '白天') + '）' : '');
}
document.querySelectorAll('#themeSeg button').forEach(function(b){
  b.addEventListener('click', function(){
    var t = b.dataset.t;
    try{ localStorage.setItem('ml_theme', t); }catch(e){}
    applyTheme(t);
    toast('主题已切换为' + TNAME[t]);
  });
});
window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change', function(){ applyTheme(curTheme()); });
applyTheme(curTheme());

/* ---- 加载 ---- */
var ME = {};
(async function init(){
  try{
    ME = await api('/api/me');
    $('#acUser').value = ME.user;
    $('#aboutUser').textContent = ME.user;
    $('#aboutVer').textContent = 'v' + ME.version;
    $('#sub').textContent = ME.user + ' · v' + ME.version;
  }catch(e){}
  try{
    var d = await api('/api/settings');
    $('#setL1').value = d.l1_minutes; $('#setL2').value = d.l2_minutes; $('#setL3').value = d.l3_minutes;
    $('#setTTL').value = d.session_ttl_hours; $('#setExp').value = d.export_limit;
  }catch(e){}
})();

/* ---- 账号 ---- */
$('#btnAccount').addEventListener('click', async function(){
  var msg = $('#acMsg'), btn = this;
  var user = $('#acUser').value.trim(), old = $('#acOld').value, np = $('#acNew').value, np2 = $('#acNew2').value;
  say(msg, '');
  if (!old){ say(msg, '要填当前密码', 'bad'); return; }
  if (!/^[A-Za-z0-9_.-]{3,32}$/.test(user)){ say(msg, '用户名 3-32 位，只能用字母、数字、_ - .', 'bad'); return; }
  if (np && np.length < 8){ say(msg, '新密码至少 8 位', 'bad'); return; }
  if (np !== np2){ say(msg, '两次输入的新密码不一致', 'bad'); return; }
  if (user === ME.user && !np){ say(msg, '用户名和密码都没改', 'bad'); return; }
  btn.disabled = true; say(msg, '保存中…');
  try{
    var d = await api('/api/account', {method:'POST', body: JSON.stringify({old: old, user: user, new: np})});
    ME.user = d.user;
    $('#acOld').value = $('#acNew').value = $('#acNew2').value = '';
    $('#aboutUser').textContent = d.user;
    $('#sub').textContent = d.user + ' · v' + ME.version;
    say(msg, d.password_changed ? '已保存，密码已更新，其他设备已退出登录' : '用户名已更新', 'ok');
    toast('已保存');
  }catch(e){ say(msg, e.message, 'bad'); }
  btn.disabled = false;
});
$('#acNew2').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('#btnAccount').click(); });

/* ---- 设置 ---- */
$('#btnSettings').addEventListener('click', async function(){
  var msg = $('#setMsg'), btn = this;
  var body = {
    l1_minutes: +$('#setL1').value, l2_minutes: +$('#setL2').value, l3_minutes: +$('#setL3').value,
    session_ttl_hours: +$('#setTTL').value, export_limit: +$('#setExp').value
  };
  say(msg, '');
  btn.disabled = true;
  try{
    await api('/api/settings', {method:'PUT', body: JSON.stringify(body)});
    say(msg, '已保存，下一轮探测按新间隔走', 'ok');
    toast('设置已保存');
  }catch(e){ say(msg, e.message, 'bad'); }
  btn.disabled = false;
});

$('#btnLogout').addEventListener('click', async function(){
  try{ await api('/api/logout', {method:'POST'}); }catch(e){}
  location.href = '/login';
});
</script>
</body>
</html>
