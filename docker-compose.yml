services:
  mirror-lens:
    image: ghcr.io/zggnh12345/mirror-lens:latest
    container_name: mirror-lens
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - "./config:/config:rw"
      - "./data:/data"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
