name: test

on:
  push:
    branches: [main, accelerator]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l . | grep -v vendor || true)
          if [ -n "$out" ]; then
            echo "以下文件未格式化："; echo "$out"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -count=1 -timeout 10m

      # 竞态检测单独一步：它慢得多，失败时能直接看出是并发问题
      - name: race
        run: go test -race ./... -count=1 -timeout 20m
